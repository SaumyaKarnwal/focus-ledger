services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: focusledger
      # Local only: the port binds to 127.0.0.1, so trust auth needs no password in any file.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "focusledger"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
