<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How the screens connect</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body{margin:0;background:#F2F0E8;color:#1A1A17;font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 1280px; height: 560px; box-sizing: border-box; background: #F2F0E8; color: #1A1A17; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 40px 24px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 24px;">
    <span style="font-family: Newsreader, Georgia, serif; font-size: 26px;">Nine screens, one loop</span>
    <div style="display: flex; align-items: center; gap: 22px; font-size: 12.5px; color: #3E3B34;">
      <span style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 26px; height: 0; border-top: 1.6px solid #1A1A17;"></span>page</span>
      <span style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 26px; height: 0; border-top: 1.6px dashed #8A3324;"></span>sheet over the page</span>
    </div>
  </div>

  <svg viewBox="0 0 1020 470" width="100%" height="100%" style="flex-grow: 1; margin-top: 6px;" role="img" aria-label="Flow diagram: Empty state leads to Home. Home starts a cycle into Running, whose bell opens the Bell sheet and returns to Home. Home opens the Node picker sheet, and leads down to the Tree, then Node detail, which can start a cycle. Home also leads to the Report, and Settings opens as a sheet from the Report or the gear on Home.">
    <defs>
      <marker id="cj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#1A1A17"></path>
      </marker>
      <marker id="cj-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#8A3324"></path>
      </marker>
    </defs>

    <g font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#5E5A51" letter-spacing="1.4">
      <text x="0" y="30">SHEETS</text>
      <text x="0" y="196">PAGES</text>
    </g>

    <g stroke="#8A3324" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#cj-arrow-accent)" marker-start="url(#cj-arrow-accent)">
      <path d="M330 200 L330 94"></path>
      <path d="M600 200 L600 94"></path>
      <path d="M900 340 L900 94"></path>
    </g>

    <g stroke="#1A1A17" stroke-width="1.6" fill="none" marker-end="url(#cj-arrow)">
      <path d="M160 229 L250 229"></path>
      <path d="M410 229 L520 229"></path>
      <path d="M570 340 L570 268"></path>
      <path d="M300 268 L300 310 L230 310 L230 340"></path>
      <path d="M380 268 L380 440 L860 440 L860 408"></path>
      <path d="M680 67 L740 67 L740 160 L370 160 L370 200"></path>
    </g>

    <g>
      <rect x="250" y="40" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#8A3324" stroke-width="1.4" stroke-dasharray="5 4"></rect>
      <text x="330" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Node picker</text>
      <text x="330" y="82" text-anchor="middle" font-size="11.5" fill="#5E5A51">search · recent · new</text>

      <rect x="520" y="40" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#8A3324" stroke-width="1.4" stroke-dasharray="5 4"></rect>
      <text x="600" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Bell</text>
      <text x="600" y="82" text-anchor="middle" font-size="11.5" fill="#5E5A51">finish · extend · switch</text>

      <rect x="820" y="40" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#8A3324" stroke-width="1.4" stroke-dasharray="5 4"></rect>
      <text x="900" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Settings</text>
      <text x="900" y="82" text-anchor="middle" font-size="11.5" fill="#5E5A51">lengths · theme · export</text>

      <rect x="20" y="202" width="140" height="54" rx="3" fill="none" stroke="#B7B1A2" stroke-width="1.4"></rect>
      <text x="90" y="227" text-anchor="middle" font-size="15" fill="#1A1A17">Empty state</text>
      <text x="90" y="244" text-anchor="middle" font-size="11.5" fill="#5E5A51">first run only</text>

      <rect x="250" y="200" width="160" height="58" rx="3" fill="#1A1A17"></rect>
      <text x="330" y="226" text-anchor="middle" font-size="16" font-weight="600" fill="#F2F0E8">Home</text>
      <text x="330" y="244" text-anchor="middle" font-size="11.5" fill="#CFCBBF">node + mode + start</text>

      <rect x="520" y="202" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#1A1A17" stroke-width="1.4"></rect>
      <text x="600" y="227" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Running</text>
      <text x="600" y="244" text-anchor="middle" font-size="11.5" fill="#5E5A51">countdown only</text>

      <rect x="150" y="340" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#1A1A17" stroke-width="1.4"></rect>
      <text x="230" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Tree</text>
      <text x="230" y="382" text-anchor="middle" font-size="11.5" fill="#5E5A51">add · rename · move</text>

      <rect x="420" y="340" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#1A1A17" stroke-width="1.4"></rect>
      <text x="500" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Node detail</text>
      <text x="500" y="382" text-anchor="middle" font-size="11.5" fill="#5E5A51">cycles · estimate</text>

      <rect x="780" y="340" width="160" height="54" rx="3" fill="#FBFAF5" stroke="#1A1A17" stroke-width="1.4"></rect>
      <text x="860" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1A17">Report</text>
      <text x="860" y="382" text-anchor="middle" font-size="11.5" fill="#5E5A51">the three tables</text>
    </g>

    <g font-size="11.5" fill="#5E5A51" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
      <text x="465" y="221" text-anchor="middle">start</text>
      <text x="612" y="150" text-anchor="start">bell writes the cycle</text>
      <text x="590" y="316" text-anchor="middle">start here</text>
      <text x="620" y="432" text-anchor="middle">read it later</text>
      <text x="345" y="120" text-anchor="start">change node</text>
      <text x="915" y="220" text-anchor="start">export</text>
    </g>
  </svg>

  <p style="margin: 0; font-size: 13px; color: #5E5A51; line-height: 1.5;">Paywall, history editor, account and sync, onboarding tour and a separate break screen are not in version one.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
